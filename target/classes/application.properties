spring.datasource.url=jdbc:h2:file:./data/exam-platform;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.error.include-message=always
app.jwt.secret=${JWT_SECRET:replace-this-secret-with-a-long-random-value-at-least-32-bytes}
app.jwt.expiration-minutes=480
app.bootstrap.teacher-username=${BOOTSTRAP_TEACHER_USERNAME:nastavnik}
app.bootstrap.teacher-password=${BOOTSTRAP_TEACHER_PASSWORD:promeni-me}
app.bootstrap.student-username=${BOOTSTRAP_STUDENT_USERNAME:student}
app.bootstrap.student-password=${BOOTSTRAP_STUDENT_PASSWORD:promeni-me}
